# Rendered from /etc/nginx/templates/default.conf.template at container start-up.
# ${BACKEND_URL} is substituted by the nginx entrypoint (envsubst); nginx's own
# variables such as $uri are left untouched because they are not environment variables.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Shared by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      image/svg+xml font/woff2;

    client_max_body_size 2m;

    # Target of the container healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # One origin for the browser: the SPA, the API and the API docs are all served
    # from here, so no CORS pre-flight and no cross-origin credentials are involved.
    location /api/ {
        # The browser and API share this nginx origin. Do not make the backend
        # reject a stale or regenerated public tunnel origin; direct API hosting
        # still uses the backend's explicit CORS allow-list.
        proxy_set_header Origin "";
        proxy_set_header Access-Control-Request-Method "";
        proxy_set_header Access-Control-Request-Headers "";
        proxy_pass ${BACKEND_URL};
    }

    location /actuator/ {
        proxy_pass ${BACKEND_URL};
    }

    location /v3/api-docs {
        proxy_pass ${BACKEND_URL};
    }

    location /swagger-ui {
        proxy_pass ${BACKEND_URL};
    }

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths are handled by react-router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
